services:
  - type: web
    name: lumiclaim-backend
    runtime: python
    pythonVersion: "3.12.0"
    buildCommand: pip install -r requirements-backend.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHONPATH
        value: .
